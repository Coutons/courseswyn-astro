name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.0.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Astro build
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      # Pastikan build selalu dalam mode statis (output: 'static' + integrasi sitemap,
      # admin di-disable). No-op jika repo sudah dalam kondisi prod — pengaman agar
      # deploy tidak pernah menghasilkan output server (dist/client + dist/server)
      # yang tidak bisa diserve GitHub Pages.
      - name: Switch to production mode
        run: npm run mode:prod

      - name: Build with Astro
        run: npm run build
        env:
          TZ: Asia/Jakarta

      # Guard: build statis harus menghasilkan homepage & sitemap.
      - name: Verify static output
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html tidak ada — build tidak statis"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "❌ dist/sitemap-index.xml tidak ada — robots.txt menunjuk ke file yang tidak ada"; exit 1; }
          echo "✅ Homepage dan sitemap ter-generate"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
