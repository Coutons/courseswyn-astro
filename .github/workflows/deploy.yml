# Build and deploy to the gh-pages branch (GitHub Pages "Deploy from a branch").
# Avoids actions/deploy-pages which times out on this repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.0.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Astro build
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            astro-cache-${{ runner.os }}-

      - name: Build with Astro
        run: npm run build
        env:
          TZ: Asia/Jakarta

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q
          git add -A
          git commit -q -m "Deploy to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
